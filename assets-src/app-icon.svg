<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    App icon for "Puzzles": four candy tiles, one nod per game —
    Queens (crown), Sort (balls in a tube), Mob (a blue runner), and Mob's red castle.
    Full-bleed cream background (the icon is also used as a maskable icon: keep the
    important bits inside the central 80% circle).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/><stop offset="1" stop-color="#f3e7d3"/>
    </linearGradient>
    <linearGradient id="t0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2c0f5"/><stop offset="1" stop-color="#a88ae0"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdcb3"/><stop offset="1" stop-color="#ffb46e"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe0ff"/><stop offset="1" stop-color="#86bcff"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdeeb6"/><stop offset="1" stop-color="#96d372"/></linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6c2"/><stop offset="0.5" stop-color="#ffc93c"/><stop offset="1" stop-color="#d98a12"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#9fd6ff"/><stop offset="0.42" stop-color="#3d8bff"/><stop offset="1" stop-color="#1c4fc4"/>
    </radialGradient>
    <radialGradient id="ballR" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#ffb0b0"/><stop offset="1" stop-color="#ef4444"/></radialGradient>
    <radialGradient id="ballY" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#f5c518"/></radialGradient>
    <radialGradient id="ballG" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#b8f5ea"/><stop offset="1" stop-color="#14b8a6"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/><stop offset="0.4" stop-color="#f0525f"/><stop offset="1" stop-color="#c7303f"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a3d1a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#drop)" stroke="#1d1b2e" stroke-width="12" stroke-linejoin="round">
    <rect x="70" y="70" width="178" height="178" rx="40" fill="url(#t0)"/>
    <rect x="264" y="70" width="178" height="178" rx="40" fill="url(#t1)"/>
    <rect x="70" y="264" width="178" height="178" rx="40" fill="url(#t2)"/>
    <rect x="264" y="264" width="178" height="178" rx="40" fill="url(#t3)"/>
  </g>
  <!-- tile gloss -->
  <g fill="#fff" opacity="0.35">
    <rect x="88" y="84" width="120" height="16" rx="8"/><rect x="282" y="84" width="120" height="16" rx="8"/>
    <rect x="88" y="278" width="120" height="16" rx="8"/><rect x="282" y="278" width="120" height="16" rx="8"/>
  </g>

  <!-- Queens: crown -->
  <g stroke="#1d1b2e" stroke-width="9" stroke-linejoin="round">
    <path d="M106 206 L100 132 L132 160 L159 116 L186 160 L218 132 L212 206 Z" fill="url(#gold)"/>
    <rect x="104" y="200" width="110" height="20" rx="8" fill="#e8a21c"/>
  </g>
  <g fill="#ff5d8f" stroke="#1d1b2e" stroke-width="5"><circle cx="159" cy="182" r="10"/></g>

  <!-- Sort: a tube of balls -->
  <g stroke="#1d1b2e" stroke-width="9" stroke-linejoin="round">
    <path d="M320 96 V206 A33 33 0 0 0 386 206 V96" fill="#fff" fill-opacity="0.55"/>
    <circle cx="353" cy="206" r="24" fill="url(#ballR)"/>
    <circle cx="353" cy="160" r="24" fill="url(#ballY)"/>
    <circle cx="353" cy="114" r="24" fill="url(#ballG)"/>
  </g>

  <!-- Mob: a blue runner -->
  <g stroke="#10224a" stroke-width="10" stroke-linejoin="round">
    <rect x="132" y="382" width="22" height="36" rx="11" fill="#1c4fc4"/>
    <rect x="164" y="382" width="22" height="36" rx="11" fill="#1c4fc4"/>
    <ellipse cx="108" cy="352" rx="14" ry="18" fill="#3d8bff"/>
    <ellipse cx="210" cy="352" rx="14" ry="18" fill="#3d8bff"/>
    <path d="M159 290 C190 290 206 316 206 344 C206 378 186 396 159 396 C132 396 112 378 112 344 C112 316 128 290 159 290 Z" fill="url(#blue)"/>
  </g>
  <circle cx="145" cy="340" r="9" fill="#0c1840"/><circle cx="173" cy="340" r="9" fill="#0c1840"/>
  <circle cx="142" cy="336" r="3.2" fill="#fff"/><circle cx="170" cy="336" r="3.2" fill="#fff"/>
  <path d="M146 364 Q159 374 172 364" fill="none" stroke="#0c1840" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="136" cy="308" rx="12" ry="7" fill="#fff" opacity="0.6" transform="rotate(-35 136 308)"/>

  <!-- Mob: the red castle -->
  <g stroke="#3e0b16" stroke-width="9" stroke-linejoin="round">
    <rect x="292" y="336" width="44" height="84" fill="url(#wall)"/>
    <rect x="370" y="336" width="44" height="84" fill="url(#wall)"/>
    <path d="M284 340 L314 286 L344 340 Z" fill="#b01d38"/>
    <path d="M362 340 L392 286 L422 340 Z" fill="#b01d38"/>
    <path d="M322 420 V322 h16 v14 h14 v-14 h16 v14 h14 v-14 h16 V420 Z" fill="url(#wall)"/>
  </g>
  <path d="M340 420 V392 A13 13 0 0 1 366 392 V420 Z" fill="#4a1020"/>
  <circle cx="314" cy="286" r="8" fill="url(#gold)" stroke="#3e0b16" stroke-width="4"/>
  <circle cx="392" cy="286" r="8" fill="url(#gold)" stroke="#3e0b16" stroke-width="4"/>
  <rect x="330" y="340" width="7" height="30" rx="3.5" fill="#fff" opacity="0.45"/>
</svg>
