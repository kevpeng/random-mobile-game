      <stop offset="0" stop-color="#9fd6ff"/>
      <stop offset="0.42" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#1c4fc4"/>
    </radialGradient>
    <g id="guy">
      <rect x="-8" y="10" width="7" height="12" rx="3.5" fill="#1c4fc4"/>
      <rect x="1" y="10" width="7" height="12" rx="3.5" fill="#1c4fc4"/>
      <path d="M0 -16 C10 -16 15 -6 15 3 C15 13 9 18 0 18 C-9 18 -15 13 -15 3 C-15 -6 -10 -16 0 -16 Z" fill="url(#skin)"/>
