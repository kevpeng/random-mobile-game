<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    Fresh grass, tileable in both directions: the content is drawn once in #tile and
    stamped at the 8 neighbouring offsets, so anything crossing an edge wraps around.
    Tufts are drawn tall because depth is squashed on screen.
  -->
  <defs>
    <g id="tile">
      <!-- soft light / dark patches -->
      <g fill="#9edb77" opacity="0.5">
        <ellipse cx="50" cy="60" rx="38" ry="30"/>
        <ellipse cx="190" cy="170" rx="44" ry="34"/>
        <ellipse cx="120" cy="240" rx="30" ry="22"/>
      </g>
      <g fill="#84c860" opacity="0.45">
        <ellipse cx="170" cy="50" rx="34" ry="26"/>
        <ellipse cx="60" cy="180" rx="36" ry="28"/>
      </g>
      <!-- tufts: little "v" blades -->
      <g fill="none" stroke="#6cb84c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
        <path d="M30 30 l4 12 l4 -12"/>
        <path d="M100 20 l-3 -10 M100 20 l3 -12 M100 20 l7 -8"/>
        <path d="M210 40 l4 12 l4 -12"/>
        <path d="M150 100 l-3 -10 M150 100 l3 -12 M150 100 l7 -8"/>
        <path d="M60 120 l4 12 l4 -12"/>
        <path d="M230 120 l-3 -10 M230 120 l3 -12 M230 120 l7 -8"/>
        <path d="M120 170 l4 12 l4 -12"/>
        <path d="M20 220 l-3 -10 M20 220 l3 -12 M20 220 l7 -8"/>
        <path d="M180 230 l4 12 l4 -12"/>
        <path d="M90 76 l4 12 l4 -12"/>
        <path d="M250 200 l-3 -10 M250 200 l3 -12 M250 200 l7 -8"/>
      </g>
      <!-- tiny light specks / flowers -->
      <g fill="#c6f0a4">
        <circle cx="70" cy="44" r="2.5"/>
        <circle cx="200" cy="90" r="2.5"/>
        <circle cx="140" cy="150" r="2.5"/>
        <circle cx="40" cy="250" r="2.5"/>
        <circle cx="236" cy="16" r="2.5"/>
      </g>
      <g fill="#fff6c2">
        <circle cx="168" cy="198" r="3"/>
        <circle cx="26" cy="140" r="3"/>
      </g>
    </g>
  </defs>
  <rect width="256" height="256" fill="#8fd16a"/>
  <use href="#tile" x="-256" y="-256"/><use href="#tile" x="0" y="-256"/><use href="#tile" x="256" y="-256"/>
  <use href="#tile" x="-256" y="0"/><use href="#tile"/><use href="#tile" x="256" y="0"/>
  <use href="#tile" x="-256" y="256"/><use href="#tile" x="0" y="256"/><use href="#tile" x="256" y="256"/>
</svg>
